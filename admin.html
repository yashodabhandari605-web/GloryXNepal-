<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GloryXNepal Admin</title><style>body{font-family:Arial;background:#080a0f;color:#fff;padding:20px}main{max-width:900px;margin:auto}.box{background:#121722;border:1px solid #293140;border-radius:15px;padding:20px;margin:15px 0}input,button{padding:12px;border-radius:8px;border:1px solid #384152;background:#090c12;color:#fff}button{background:#ffc400;color:#111;font-weight:bold}.row{border-top:1px solid #303746;padding:15px 0}.p{color:#ffd43e}</style></head><body><main><h1>⚡ GloryXNepal Admin</h1><div class="box"><input id="pw" type="password" placeholder="Admin password"><button onclick="load()">View Orders</button></div><div id="orders" class="box">Orders will appear here.</div></main><script>
const API_URL="PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";
async function load(){{let p=document.getElementById('pw').value;if(API_URL.startsWith("PASTE_"))return alert("Connect Apps Script first.");try{{let r=await fetch(API_URL+"?action=list&password="+encodeURIComponent(p));let d=await r.json();document.getElementById('orders').innerHTML=d.orders?.length?d.orders.map(o=>`<div class="row"><b>#${{o["Order ID"]}}</b> — <span class="p">${{o.Status}}</span><br>UID: ${{o.UID}}<br>${{o.Service}} • ${{o.Package}}<br>Rs.${{o.Amount}} • Ref: ${{o["Transaction ID"]}}</div>`).join(""):"No orders yet."}}catch(e){{alert("Could not load orders.")}}}}
</script></body></html>
